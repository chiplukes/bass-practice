<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bass practice</title>
  <link rel="stylesheet" href="/style.css?v=6" />
</head>
<body>
  <header>
    <h1>bass practice</h1>
    <nav id="tabs">
      <button class="tab active" data-view="flashcards">Flashcards</button>
      <button class="tab" data-view="song">Song</button>
      <button class="tab" data-view="fretboard">Fretboard</button>
      <button class="tab" data-view="ear">Ear trainer</button>
    </nav>
    <div class="sound">
      <label><input id="sound-toggle" type="checkbox" checked /> sound</label>
      <button id="sound-test" class="ghost">Test</button>
    </div>
  </header>

  <main>
    <section id="view-flashcards" class="view active">
      <div class="controls">
        <label>seconds per card
          <input id="fc-seconds" type="number" min="0.5" step="0.5" value="2" />
        </label>
        <label>note range
          <select id="fc-range">
            <option value="E2|G3">Open strings (E2 - G3)</option>
            <option value="E3|E5">High (E3 - E5)</option>
            <option value="E2|A3">Low (E2 - A3)</option>
          </select>
        </label>
        <label><input id="fc-show-note" type="checkbox" checked /> note</label>
        <label><input id="fc-show-tab" type="checkbox" checked /> tab</label>
        <label><input id="fc-show-notation" type="checkbox" checked /> notation</label>
        <label><input id="fc-show-fretboard" type="checkbox" /> fretboard</label>
        <button id="fc-toggle">Start</button>
        <button id="fc-pause" disabled>Pause</button>
      </div>
      <div class="study-card">
        <div class="study-card-panels">
          <div id="fc-note-name" class="note-name"></div>
          <div id="fc-notation"></div>
          <div id="fc-tab"></div>
        </div>
        <div id="fc-fretboard-helper" class="fretboard"></div>
      </div>
    </section>

    <section id="view-song" class="view">
      <div class="controls">
        <label>song
          <select id="song-select"></select>
        </label>
        <button id="song-load">Load</button>
      </div>
      <div class="controls">
        <button id="song-play">Play</button>
        <button id="song-stop">Stop</button>
        <button id="song-prev">Prev</button>
        <button id="song-next">Next</button>
        <label>tempo (bpm)
          <input id="song-bpm" type="number" min="30" step="5" value="120" />
        </label>
        <label>speed
          <input id="song-speed" type="number" min="0.25" step="0.25" value="1" />
        </label>
        <label>loop from note
          <input id="song-loop-start" type="number" min="1" step="1" placeholder="1" style="width:4em" />
        </label>
        <label>to
          <input id="song-loop-end" type="number" min="1" step="1" placeholder="end" style="width:4em" />
        </label>
      </div>
      <div class="controls">
        <label><input id="song-show-note" type="checkbox" checked /> note</label>
        <label><input id="song-show-tab" type="checkbox" checked /> tab</label>
        <label><input id="song-show-notation" type="checkbox" checked /> notation</label>
        <label><input id="song-show-fretboard" type="checkbox" /> fretboard</label>
      </div>
      <div class="study-card">
        <div class="study-card-panels">
          <div id="song-note-name" class="note-name"></div>
          <div id="song-notation"></div>
          <div id="song-tab"></div>
        </div>
        <div id="song-fretboard-helper" class="fretboard"></div>
      </div>
      <div id="song-progress" class="muted"></div>
    </section>

    <section id="view-fretboard" class="view">
      <div class="controls">
        <button id="fb-new">New note</button>
        <button id="fb-reveal">Reveal</button>
        <span id="fb-score" class="muted"></span>
      </div>
      <div id="fb-note" class="card">Click "New note" to begin</div>
      <div id="fb-grid" class="fretboard"></div>
    </section>

    <section id="view-ear" class="view">
      <div class="controls">
        <label>key
          <select id="ear-root"></select>
        </label>
        <label>count
          <input id="ear-count" type="number" min="1" step="1" value="8" />
        </label>
        <button id="ear-new">New exercise</button>
        <button id="ear-play-key">Play key</button>
        <button id="ear-play">Play note</button>
        <span id="ear-score" class="muted"></span>
      </div>
      <fieldset id="ear-degrees" class="intervals">
        <legend>scale degrees</legend>
      </fieldset>
      <div id="ear-question" class="card">Create an exercise to begin</div>
      <div id="ear-answers" class="answers"></div>
    </section>
  </main>

  <footer class="muted">
    Served by bass-practice. Audio is synthesized in your browser.
  </footer>

  <script src="/vendor/vexflow.js?v=6"></script>
  <script src="/audio.js?v=6"></script>
  <script src="/notation.js?v=6"></script>
  <script src="/app.js?v=6"></script>
</body>
</html>
