<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bass practice</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>bass practice</h1>
    <nav id="tabs">
      <button class="tab active" data-view="flashcards">Flashcards</button>
      <button class="tab" data-view="song">Song</button>
      <button class="tab" data-view="fretboard">Fretboard</button>
      <button class="tab" data-view="ear">Ear trainer</button>
    </nav>
  </header>

  <main>
    <section id="view-flashcards" class="view active">
      <div class="controls">
        <label>seconds per card
          <input id="fc-seconds" type="number" min="0.5" step="0.5" value="2" />
        </label>
        <label>note range
          <select id="fc-range">
            <option value="E1|G2">Open strings (E1 - G2)</option>
            <option value="E2|E4">High (E2 - E4)</option>
            <option value="E1|A2">Low (E1 - A2)</option>
          </select>
        </label>
        <button id="fc-toggle">Start</button>
      </div>
      <div id="fc-display" class="card">Press Start</div>
    </section>

    <section id="view-song" class="view">
      <div class="controls">
        <label>song
          <select id="song-select"></select>
        </label>
        <button id="song-load">Load</button>
      </div>
      <div class="controls">
        <button id="song-play">Play</button>
        <button id="song-stop">Stop</button>
        <button id="song-prev">Prev</button>
        <button id="song-next">Next</button>
        <label>tempo (bpm)
          <input id="song-bpm" type="number" min="30" step="5" value="120" />
        </label>
        <label>speed
          <input id="song-speed" type="number" min="0.25" step="0.25" value="1" />
        </label>
      </div>
      <div id="song-display" class="card">Load a song to begin</div>
      <div id="song-progress" class="muted"></div>
    </section>

    <section id="view-fretboard" class="view">
      <div class="controls">
        <button id="fb-new">New note</button>
        <button id="fb-reveal">Reveal</button>
        <span id="fb-score" class="muted"></span>
      </div>
      <div id="fb-note" class="card">Click "New note" to begin</div>
      <div id="fb-grid" class="fretboard"></div>
    </section>

    <section id="view-ear" class="view">
      <div class="controls">
        <label>root
          <select id="ear-root"></select>
        </label>
        <label>count
          <input id="ear-count" type="number" min="1" step="1" value="8" />
        </label>
        <label><input id="ear-desc" type="checkbox" /> descending</label>
        <button id="ear-new">New exercise</button>
        <button id="ear-play">Play</button>
        <span id="ear-score" class="muted"></span>
      </div>
      <fieldset id="ear-intervals" class="intervals">
        <legend>intervals</legend>
      </fieldset>
      <div id="ear-question" class="card">Create an exercise to begin</div>
      <div id="ear-answers" class="answers"></div>
    </section>
  </main>

  <footer class="muted">
    Served by bass-practice. Audio is synthesized in your browser.
  </footer>

  <script src="/audio.js"></script>
  <script src="/app.js"></script>
</body>
</html>
