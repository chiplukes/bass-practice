[project]
name = "bass-practice"
dynamic = ["version"]
description = "A locally-served web app for practicing bass: flashcards, song sequences, fretboard and ear training."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["bass", "music", "practice", "flashcards", "ear-training", "fretboard", "fastapi"]
authors = [
    { name = "Chip Lukes", email = "34627158+chiplukes@users.noreply.github.com" },
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Education",
    "Topic :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "bass_practice._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["bass_practice*"]

[tool.setuptools.package-data]
"bass_practice" = ["songs/*.json"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.15",
    "mypy>=1.0",
    "pre-commit",
]

[project.scripts]
bass-practice = "bass_practice.__main__:main"

[project.urls]
Homepage = "https://github.com/chiplukes/bass-practice"
Repository = "https://github.com/chiplukes/bass-practice"
"Bug Tracker" = "https://github.com/chiplukes/bass-practice/issues"

# ---------------------------------------------------------------------------
# Ruff — linter and formatter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line length enforced by formatter, not linter
]

[tool.ruff.lint.isort]
known-first-party = ["bass_practice"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["bass_practice.static"]
ignore_errors = true
